name: Generate RSS feeds and deploy to GitHub Pages

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual trigger from Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # ── Cache Rust toolchain + compiled deps ──────────────────────────
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build rssify (release)
        run: cargo build --release

      # ── Restore previous RSS files so dedup works across runs ────────
      - uses: actions/cache@v4
        with:
          path: rss
          key: rss-feeds-${{ github.run_id }}
          restore-keys: |
            rss-feeds-

      - name: Generate RSS feeds
        run: ./target/release/rssify -o rss

      # ── Prepare site directory for Pages ─────────────────────────────
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp rss/*.xml _site/
          cp pages-index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
