name: Generate RSS feeds

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual trigger from Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rss
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Cache Rust toolchain + compiled deps ──────────────────────────
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build rssify (release)
        run: cargo build --release

      # ── RSS files live in rss/ in the repo; checkout restores them ──

      - name: Generate RSS feeds
        run: ./target/release/rssify -o rss -n 3

      # ── Commit RSS files back to the repo so dedup persists ──────────
      - name: Commit RSS feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss/
          git diff --cached --quiet || git commit -m "chore: update RSS feeds [skip ci]"
          git push
